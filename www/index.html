<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Процедуры</title>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #1c2733;
    --muted: #5d6b7a;
    --line: #cfd7df;
    --accent: #1f6f78;
    --accent-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151b22;
      --surface: #1e2630;
      --ink: #e6ebf0;
      --muted: #97a4b1;
      --line: #334050;
      --accent: #4fb3bd;
      --accent-ink: #0f1a1c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 46rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 1.25rem; font-weight: 700; }
  a { color: inherit; }

  /* Главная: список разделов */
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .list li { border-bottom: 1px solid var(--line); }
  .list a {
    display: block;
    padding: .85rem .25rem;
    text-decoration: none;
  }
  .list a:hover { background: var(--surface); }
  .list a:focus-visible, .btn:focus-visible, .back:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .empty { color: var(--muted); }
  .section-title { margin: 0 0 1.25rem; font-weight: 700; line-height: 1.35; }
  .section-title span { display: block; }
  .sec-num { font-size: 1.6rem; margin-bottom: .35rem; }
  .sec-line { font-size: 1.1rem; }
  .section-title ~ .section-title { margin-top: 2.25rem; }

  /* Навигация */
  .back {
    display: inline-block;
    margin-bottom: 1rem;
    color: var(--muted);
    text-decoration: none;
    font-size: .95rem;
  }
  .back:hover { color: var(--ink); text-decoration: underline; }

  /* Две кнопки раздела */
  .tabs { display: flex; gap: .75rem; margin: 0 0 1.5rem; flex-wrap: wrap; }
  .tab {
    flex: 1 1 10rem;
    text-align: center;
    padding: .8rem 1rem;
    border: 2px solid var(--accent);
    border-radius: 6px;
    text-decoration: none;
    font-weight: 700;
    color: var(--accent);
    background: transparent;
  }
  .tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
  .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Описание */
  .desc { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1.25rem 1.25rem .5rem; }
  .desc p { margin: 0 0 1rem; white-space: pre-line; }
  .desc .label { font-weight: 700; }

  /* Процедура */
  .practice { flex: 1; display: flex; flex-direction: column; }
  .variants { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .variant {
    font: inherit; font-size: .95rem; padding: .5rem .9rem; cursor: pointer;
    color: var(--accent); background: transparent;
    border: 2px solid var(--line); border-radius: 6px;
  }
  .variant[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .variant:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .field { margin-bottom: 1rem; }
  .field-label { display: block; color: var(--muted); font-size: .95rem; margin-bottom: .35rem; }
  .field-input {
    width: 100%;
    font: inherit;
    padding: .7rem .85rem;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 6px;
  }
  .field-input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  .stage { flex: 1; display: flex; align-items: center; min-height: 40vh; }
  .command { font-size: 1.9rem; line-height: 1.35; margin: 0; }
  .command { white-space: pre-line; }
  .command.long { font-size: 1.25rem; line-height: 1.6; }
  .command .lead { display: block; color: var(--muted); font-size: 1.15rem; margin-bottom: .5rem; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-top: 1.5rem; }
  .counter { color: var(--muted); font-size: .95rem; }
  .btns { display: flex; gap: .75rem; margin-left: auto; }
  .btn {
    font: inherit;
    font-weight: 700;
    padding: .8rem 2rem;
    border-radius: 6px;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn[disabled] { opacity: .4; cursor: default; }
  @media (max-width: 480px) {
    body { font-size: 18px; }
    .command { font-size: 1.55rem; }
    .btn { padding: .8rem 1.4rem; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   ДАННЫЕ. Каждая процедура — один объект в массиве PROCEDURES.

   Два вида практической части (procedure.type):

   1) "cycle" — команды идут по кругу:
      procedure: { type: "cycle", steps: ["команда 1", "команда 2"] }

   2) "list" — список с общим началом, проходим по очереди:
      procedure: { type: "list", lead: "Почувствуйте живость",
                   items: ["правой кисти руки", "левой кисти руки"] }
      (в конце списка показывается «Список закончен» и кнопка «Сначала»)

   Номера: у процедур раздела I id = номер (1, 2, 3...). Для следующих
   разделов id должен быть уникальным, поэтому: id: "II-1", num: 1,
   sectionNo: 2 (для раздела III: "III-1", sectionNo: 3 и т.д.) (num — номер для показа, sectionNo — порядок разделов).

   loopFrom: 1 — если команды идут не по полному кругу, а, например,
   1, 2, 2, 2... (первая команда один раз, дальше повторяется со второй).

   Поле для ввода: если в команде есть слово(а), которые нужно вписывать
   (часть тела, предмет и т.д.), в тексте команды ставится {}, а в procedure
   добавляется field: { label: "подсказка над полем", blank: "___________" }.
   Тогда над командой появляется поле, и то, что в нём написано,
   подставляется в {} на всех экранах.

   Шаблон для новой процедуры — внизу, в комментарии.
   ============================================================ */
var PROCEDURES = [
  {
    id: 1,
    section: "РАЗДЕЛ I\nОСНОВНЫЕ АССИСТЫ\nПРИ БОЛЕЗНЯХ И ТРАВМАХ",
    title: "КОНТАКТНЫЙ АССИСТ",
    description: [
      { label: "Ссылки:", text: "БОХС 9 окт. 67ПА, КОНТАКТНЫЙ АССИСТ, Инструктивный фильм ТУ №10, Ассисты" },
      { label: "Использование процесса:", text: "Если доступно точное место, где произошел несчастный случай или травма, всегда проводите Контактный ассист. После этого можно поработать ассистом-прикосновением или другими типами ассистов, но первым делом всегда нужно делать Контактный ассист. Если физическая вселенная доступна, делайте Контактный ассист." },
      { label: "Информация:", text: "Есть один очень, очень старый принцип в Саентологии, который состоит в помещении травмированной части тела точно в то самое место, где была получена травма. Это называется Контактным ассистом и является наиболее широко распространенным ассистом для несчастных случаев и травм. Если есть возможность его провести, это замечательно." },
      { label: "Процедура:", text: "" },
      { text: "1. Помните, что перед началом Контактного ассиста часто нужно оказать первую помощь и помочь физически. Сначала всегда окажите первую помощь. Посмотрите на ситуацию с точки зрения того, насколько необходимо проведение первой помощи, и когда все эти вопросы будут урегулированы, переходите к ассисту. Одитинг не может заткнуть поток крови из артерии, для этого нужно наложить жгут." },
      { text: "2. Отведите человека точно на то место, где произошел несчастный случай. Если предмет был горячим, вы сначала остужаете его; если имелось электрическое напряжение, вы выключаете его перед началом ассиста." },
      { text: "3. Скажите человеку: “Мы проведем Контактный ассист”." },
      { text: "4. Пусть человек примет то же положение, в котором он находился перед тем, как произошел инцидент. Если у него в руке был инструмент, или он работал им, он должен проделать им те же самые движения." },
      { text: "5. Попросите человека медленно двигаться через инцидент, как будто бы он происходит снова. Пусть он точно воспроизведет то, что произошло в момент получения травмы, дотронется до той точки травмированной частью тела. Заставьте его легко коснуться того предмета, что нанес ему травму. Если он уколол палец о шип в розарии, вы заставляете его коснуться той же самой части тем же пальцем, который был уколот, того же самого шипа. Если он прищемил дверью пальцы, вы ведете его обратно, и притрагиваетесь его рукой до того же самого места на той же самой двери, воспроизводя те же самые движения, которые происходили во время получения травмы. Здесь даже не нужно никаких команд, чем меньше вы говорите, тем лучше у вас все получится." },
      { text: "6. Повторяйте это снова и снова, до тех пор, пока не включится именно та соматика, и пока она не исчезнет, что будет сопровождаться озарением. Вы должны заставить его притронуться до той же самой точки, чтобы добиться этого точного явления. Когда это происходит, заканчивайте ассист словами “Конец ассиста”." },
      { text: "Проходите до тех пор, пока не включится точная соматика, и пока она не исчезнет, что будет сопровождаться озарением." },
      { label: "Замечания по проведению:", text: "Иногда Контактный ассист надо делать с соблюдением принципа постепенности. Скажем, ребенок ушибся голенью о газонокосилку и теперь не желает подходить к ней ближе чем на сто метров. Вы должны провести с ним Контактный ассист с его телом и голенью прямо там (на расстоянии ста метров от газонокосилки), выполнив с ним все движения этого инцидента. Постепенно, раз за разом, вы уменьшаете расстояние, на которое он готов приблизиться к ней, и в конце концов он подойдет и сделает Контактный ассист с самой газонокосилкой." },
      { text: "Вам никогда не следует силой тащить человека на то место, где произошел инцидент или была получена травма. Если вы будете стараться принудить ПК, вы его подавите." },
      { text: "Контактный ассист можно делать самому себе, но при этом нужно удостовериться, что он выполняется до исчезновения соматики." },
      { text: "Любой тип травмы можно обработать Контактным ассистом. Если доступно точное место получения травмы, то это всегда самый лучший тип ассиста, и он должен делаться прежде всех остальных действий-ассистов. Контактный ассист не ограничен в использовании. Иногда они производят чудеса - а уж помогают неизменно." }
    ],
    procedure: {
      type: "list",
      items: [
        "1. Помните, что перед началом Контактного ассиста часто нужно оказать первую помощь и помочь физически. Сначала всегда окажите первую помощь. Посмотрите на ситуацию с точки зрения того, насколько необходимо проведение первой помощи, и когда все эти вопросы будут урегулированы, переходите к ассисту. Одитинг не может заткнуть поток крови из артерии, для этого нужно наложить жгут.",
        "2. Отведите человека точно на то место, где произошел несчастный случай. Если предмет был горячим, вы сначала остужаете его; если имелось электрическое напряжение, вы выключаете его перед началом ассиста.",
        "3. Скажите человеку: “Мы проведем Контактный ассист”.",
        "4. Пусть человек примет то же положение, в котором он находился перед тем, как произошел инцидент. Если у него в руке был инструмент, или он работал им, он должен проделать им те же самые движения.",
        "5. Попросите человека медленно двигаться через инцидент, как будто бы он происходит снова. Пусть он точно воспроизведет то, что произошло в момент получения травмы, дотронется до той точки травмированной частью тела. Заставьте его легко коснуться того предмета, что нанес ему травму. Если он уколол палец о шип в розарии, вы заставляете его коснуться той же самой части тем же пальцем, который был уколот, того же самого шипа. Если он прищемил дверью пальцы, вы ведете его обратно, и притрагиваетесь его рукой до того же самого места на той же самой двери, воспроизводя те же самые движения, которые происходили во время получения травмы. Здесь даже не нужно никаких команд, чем меньше вы говорите, тем лучше у вас все получится.",
        "6. Повторяйте это снова и снова, до тех пор, пока не включится именно та соматика, и пока она не исчезнет, что будет сопровождаться озарением. Вы должны заставить его притронуться до той же самой точки, чтобы добиться этого точного явления. Когда это происходит, заканчивайте ассист словами “Конец ассиста”.",
        "Проходите до тех пор, пока не включится точная соматика, и пока она не исчезнет, что будет сопровождаться озарением."
      ],
      endText: "Процедура закончена"
    }
  },

  {
    id: 2,
    section: "РАЗДЕЛ I\nОСНОВНЫЕ АССИСТЫ\nПРИ БОЛЕЗНЯХ И ТРАВМАХ",
    title: "АССИСТ-ПРИКОСНОВЕНИЕ",
    description: [
      { label: "Ссылки:", text: "БОХС 7 апр. 72ПА, ПРАВИЛЬНЫЕ АССИСТЫ-ПРИКОСНОВЕНИЯ, БОХС 25 авг. 87 II, ЕЩЕ ОБ АССИСТАХ-ПРИКОСНОВЕНИЯХ, Инструктивный фильм ТУ №10, Ассисты" },
      { label: "Использование процесса:", text: "Целью ассиста-прикосновения является восстановление коммуникации с больными или травмированными частями тела. Он обращает внимание человека на травмированные или поврежденные части тела. Это делается путем путем повторного прикасания к больному или поврежденному телу человека и установления у него коммуникации с травмой. Его коммуникация с ней приведет к выздоровлению. Этот метод основан на том принципе, что способ излечить или исправить что-либо состоит в помещении человека в коммуникацию с этим." },
      { text: "Каждая конкретная физическая болезнь происходит от неудачи в налаживании коммуникации с предметом или больной областью. Продолжение хронической травмы происходит из-за отсутствия физической коммуникации с поврежденной областью или расположением места получения травмы в физической вселенной." },
      { text: "Когда внимание отходит от травмированных или поврежденных частей тела, то же происходит и с циркуляцией, нервными потоками и энергией. Это ограничивает питание этих областей и мешает выведению шлаков. Некоторые целители древности приписывали “наложению рук” необыкновенные “потоки энергии” и качества. Вероятно, при этом срабатывало просто то, что повышалась осведомленность о пораженной области и восстанавливались факторы физической коммуникации." },
      { text: "Например, если вы проводите ассист-прикосновение человеку, у которого растяжение запястья, то вы почти силой приводите его в состояние коммуникации с этим запястьем, настолько полно, насколько это возможно. Когда он снова полностью восстанавливает свою коммуникацию с ним, у него проходит это растяжение." },
      { text: "Кроме управления вниманием человека и его направления, ассист-прикосновение также работает с факторами местоположения и времени. Когда человек получил травму, его внимание избегает травмированной или поврежденной части тела, но в то же время оно застревает в нем. Оно также избегает местоположения получения травмы, а сам человек и травмированная часть тела застревают во времени (моменте) получения травмы. Ассист-прикосновение дает выздоровлению возможность произойти, в какой-то степени возвращая человека в настоящее время и окружение." },
      { label: "Процедура:", text: "" },
      { text: "Прежде чем приступать к проведению ассиста, убедитесь в том, что оказана вся необходимая первая помощь. Если у человека артериальное кровотечение, и он может потерять всю кровь в течение четырех-пяти минут, то правильной последовательностью действий будет сначала наложение жгута, а затем проведение ассиста-прикосновения." },

      { text: "Сообщите преклиру команду, которую вы будете использовать и убедитесь в том, что он ее понимает. Используемая команда такова:" },

      { text: "кроме тех случаев, когда вы имеете дело с кейсом низкого уровня. Для последних используется команда:" },
      { text: "“Почувствуй мой палец”." },

      { text: "3. Попросите преклира закрыть глаза. (Замечание: Если вы используете команду “Почувствуй мой палец”, то этот шаг пропускается.)" },
      { text: "4. Дайте команду" },
      { text: "“Посмотри на мой палец” (или “Почувствуй мой палец”)," },
      { text: "а потом дотроньтесь до точки, нажимая пальцем со средней силой." },
      { text: "НЕ притрагивайтесь до того, как подана команда, иначе вы нарушите последовательность." },

        "С чем (или с кем) вы могли бы общаться из этой комнаты?"
      ]
    }
  }



  /* ШАБЛОН (скопируйте, поставьте запятую после предыдущей процедуры):
  ,{
    id: 19,
    title: "НАЗВАНИЕ",
    description: [
      { label: "Ссылки:", text: "..." },
      { label: "Процедура:", text: "..." }
    ],
    procedure: {
      type: "list",
      lead: "Почувствуйте живость",
      items: ["правой кисти руки", "левой кисти руки", "затылка"]
    }
  }
  */
];

/* ============================================================
   КОД СТРАНИЦЫ (менять не нужно)
   Адреса: #/ — главная, #/18 — описание, #/18/proc — процедура
   ============================================================ */
var app = document.getElementById("app");
var state = { id: null, pos: 0, vals: {}, variant: {} };

function el(tag, attrs, children) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "text") n.textContent = attrs[k];
    else if (k === "class") n.className = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { n.appendChild(c); });
  return n;
}

/* Номер для показа (num, если задан, иначе id) и номер раздела (sectionNo, по умолчанию 1) */
function numOf(p) { return p.num !== undefined ? p.num : p.id; }
function secOf(p) { return p.sectionNo || 1; }

function findProc(id) {
  for (var i = 0; i < PROCEDURES.length; i++) if (String(PROCEDURES[i].id) === String(id)) return PROCEDURES[i];
  return null;
}

function renderHome() {
  document.title = "Процедуры";
  app.innerHTML = "";
  var sorted = PROCEDURES.filter(function (p) { return !p.hidden; })
    .sort(function (a, b) { return secOf(a) - secOf(b) || numOf(a) - numOf(b); });
  if (!sorted.length) { app.appendChild(el("p", { class: "empty", text: "Пока нет ни одной процедуры." })); return; }
  var ul = null, lastSection = null;
  sorted.forEach(function (p) {
    var sec = p.section || "";
    if (!ul || sec !== lastSection) {
      if (sec) {
        var h = el("h2", { class: "section-title" });
        sec.split("\n").forEach(function (line, i) {
          h.appendChild(el("span", { class: i === 0 ? "sec-num" : "sec-line", text: line }));
        });
        app.appendChild(h);
      }
      ul = el("ul", { class: "list" });
      app.appendChild(ul);
      lastSection = sec;
    }
    var a = el("a", { href: "#/" + p.id, "data-id": String(p.id), text: numOf(p) + ". " + p.title });
    ul.appendChild(el("li", null, [a]));
  });
}

function header(p, mode) {
  app.innerHTML = "";
  document.title = numOf(p) + ". " + p.title;
  app.appendChild(el("a", { class: "back", href: "#/", text: "← Все процедуры" }));
  app.appendChild(el("h1", { text: numOf(p) + ". " + p.title }));
  var d = el("a", { class: "tab", href: "#/" + p.id, text: "Описание" });
  var r = el("a", { class: "tab", href: "#/" + p.id + "/proc", text: "Процедура" });
  (mode === "desc" ? d : r).setAttribute("aria-current", "page");
  app.appendChild(el("nav", { class: "tabs" }, [d, r]));
}

function renderDesc(p) {
  header(p, "desc");
  var box = el("div", { class: "desc" });
  p.description.forEach(function (part) {
    var para = el("p");
    if (part.label) {
      para.appendChild(el("span", { class: "label", text: part.label }));
      if (part.text) para.appendChild(document.createTextNode(" " + part.text));
    } else {
      para.appendChild(document.createTextNode(part.text));
    }
    box.appendChild(para);
  });
  app.appendChild(box);
}

/* что показывать на позиции pos */
/* Текущий вариант практической части (если у процедуры есть variants) */
function curProc(p) {
  var pr = p.procedure;
  if (!pr.variants) return pr;
  var v = pr.variants[state.variant[p.id] || 0];
  return { type: v.type || pr.type, steps: v.steps, items: v.items, lead: v.lead, fields: v.fields, loopFrom: v.loopFrom, endText: v.endText || pr.endText };
}
function fieldsOf(pr) { return pr.fields || (pr.field ? [pr.field] : []); }
function valKey(p, i) { return p.id + ":" + (state.variant[p.id] || 0) + ":" + i; }

/* Подставляет введённые слова: {} или {1} — поле 1, {2} — поле 2 и т.д. */
function fill(p, text) {
  var fs = fieldsOf(curProc(p));
  return text.replace(/\{(\d*)\}/g, function (m, n) {
    var i = n ? parseInt(n, 10) - 1 : 0;
    var f = fs[i] || {};
    var v = (state.vals[valKey(p, i)] || "").trim();
    return v || f.blank || "___________";
  });
}

function stepAt(p, pos) {
  var pr = curProc(p);
  if (pr.type === "list") {
    if (pos >= pr.items.length) return { done: true };
    return { lead: pr.lead, text: fill(p, pr.items[pos]), total: pr.items.length };
  }
  var n = pr.steps.length, idx = pos % n;
  /* loopFrom: после первого прохода по кругу повторяются только команды начиная с этого номера (0, 1, ...) */
  if (pr.loopFrom !== undefined && pos >= n) idx = pr.loopFrom + (pos - pr.loopFrom) % (n - pr.loopFrom);
  var e = pr.steps[idx];
  if (typeof e === "object") return { lead: e.lead, text: fill(p, e.text) };
  return { text: fill(p, e) };
}

function renderProc(p) {
  header(p, "proc");
  if (!p.procedure) {
    app.appendChild(el("p", { class: "empty", text: "Практическая часть для этой процедуры пока не добавлена." }));
    return;
  }
  var pr = curProc(p);
  var wrap = el("div", { class: "practice" });

  if (p.procedure.variants) {
    var vb = el("div", { class: "variants" });
    p.procedure.variants.forEach(function (v, i) {
      var b = el("button", { class: "variant", type: "button", text: v.name });
      if (i === (state.variant[p.id] || 0)) b.setAttribute("aria-pressed", "true");
      b.addEventListener("click", function () { state.variant[p.id] = i; state.pos = 0; renderProc(p); });
      vb.appendChild(b);
    });
    wrap.appendChild(vb);
  }

  fieldsOf(pr).forEach(function (f, i) {
    var inp = el("input", { class: "field-input", type: "text", id: "field" + i, autocomplete: "off", value: state.vals[valKey(p, i)] || "" });
    var lab = el("label", { class: "field-label", for: "field" + i, text: f.label || "Впишите слово" });
    wrap.appendChild(el("div", { class: "field" }, [lab, inp]));
    inp.addEventListener("input", function () { state.vals[valKey(p, i)] = inp.value; show(); });
  });

  var stage = el("div", { class: "stage" });
  var cmd = el("p", { class: "command", "aria-live": "polite" });
  stage.appendChild(cmd);
  var counter = el("span", { class: "counter" });
  var back = el("button", { class: "btn ghost", type: "button", text: "Назад" });
  var next = el("button", { class: "btn", type: "button", text: "Вперед" });
  var bar = el("div", { class: "bar" }, [counter, el("div", { class: "btns" }, [back, next])]);
  wrap.appendChild(stage);
  wrap.appendChild(bar);
  app.appendChild(wrap);

  function show() {
    var s = stepAt(p, state.pos);
    cmd.innerHTML = "";
    if (s.done) {
      cmd.className = "command";
      cmd.textContent = pr.endText || "Список закончен";
      next.textContent = "Сначала";
      counter.textContent = "";
    } else {
      if (s.lead) cmd.appendChild(el("span", { class: "lead", text: s.lead }));
      cmd.appendChild(document.createTextNode(s.text));
      cmd.className = "command" + (s.text.length > 160 ? " long" : "");
      next.textContent = "Вперед";
      counter.textContent = s.total ? (state.pos + 1) + " из " + s.total : "Команда " + (state.pos + 1);
    }
    back.disabled = state.pos === 0;
  }
  next.addEventListener("click", function () {
    var s = stepAt(p, state.pos);
    state.pos = s.done ? 0 : state.pos + 1;
    show();
  });
  back.addEventListener("click", function () {
    if (state.pos > 0) { state.pos--; show(); }
  });
  show();
}

function route() {
  var parts = (location.hash || "#/").replace(/^#\/?/, "").split("/");
  var id = parts[0];
  if (!id) {
    renderHome();
    /* вернуться к процедуре, с которой пришли */
    var last = null;
    if (state.id !== null) {
      var links = app.querySelectorAll("a[data-id]");
      for (var k = 0; k < links.length; k++) if (links[k].getAttribute("data-id") === String(state.id)) last = links[k];
    }
    if (last) { last.scrollIntoView({ block: "center" }); last.focus({ preventScroll: true }); }
    else window.scrollTo(0, 0);
    return;
  }
  var p = findProc(id);
  if (!p) { renderHome(); return; }
  if (state.id !== p.id || parts[1] !== "proc") state.pos = 0;
  state.id = p.id;
  if (parts[1] === "proc") renderProc(p); else renderDesc(p);
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", function (e) {
  if (!/\/proc$/.test(location.hash)) return;
  if (e.target && e.target.tagName === "INPUT") return;
  var btns = app.querySelectorAll(".btns .btn");
  if (e.key === "ArrowRight" && btns[1]) btns[1].click();
  if (e.key === "ArrowLeft" && btns[0]) btns[0].click();
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
